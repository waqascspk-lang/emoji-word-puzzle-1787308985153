name: 'emoji_word_puzzle'
description: 'A Flutter emoji word puzzle game'
publish_to: 'none'
version: '1.0.0+1'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: '^6.1.2'
  google_fonts: '^6.1.0'
  intl: '^0.19.0'
  shared_preferences: '^2.3.2'
  confetti: '^0.7.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '^4.0.0'

flutter:
  uses-material-design: true